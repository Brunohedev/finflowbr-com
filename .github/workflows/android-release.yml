name: FinFlow Android Release AAB

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          node -e "require('fs').writeFileSync('android/app/finflow-release.keystore', Buffer.from(process.env.KEYSTORE_BASE64, 'base64'))"

      - name: Verify keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "Keystore size:"
          ls -lh android/app/finflow-release.keystore

          echo "Keystore SHA256:"
          sha256sum android/app/finflow-release.keystore

          echo "Validating keystore:"
          keytool -list -v \
            -keystore android/app/finflow-release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias finflow

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: FinFlow-Br-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab