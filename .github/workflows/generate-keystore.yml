name: Generate Android Keystore

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore finflow-release.keystore \
            -alias finflow \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=FinFlow Br, OU=FinFlow, O=FinFlow Br, L=Massachusetts, ST=Massachusetts, C=US"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: FinFlow-release-keystore
          path: finflow-release.keystore
          retention-days: 1